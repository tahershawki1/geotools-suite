<link rel="stylesheet" href="./css/navbar.css" />
<div class="shell-unified">
  <header class="app-header" role="banner" aria-label="GeoTools app header">
    <div class="header-left">
      <button class="back-btn" type="button" id="header-back-btn" aria-label="Go back to home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="app-logo-mark" aria-hidden="true"></div>
      <div class="app-logo-copy">
        <span class="app-logo-title">GeoTools</span>
        <span class="app-logo-sub" data-current-page-label>Survey Suite</span>
      </div>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" type="button" aria-label="Info" id="header-info-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="shell-main-slot" id="shell-main-slot"></section>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <div class="more-drawer" id="more-drawer" role="dialog" aria-label="More tools" aria-hidden="true">
    <div class="drawer-handle" aria-hidden="true"></div>
    <p class="drawer-title">More Tools</p>
    <div class="drawer-grid" id="drawer-grid"></div>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-links-unified" id="bottom-nav-links"></div>
  </nav>
</div>
