<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060c18" />
    <title>GeoTools Suite</title>

    <script src="./shared/js/tools-registry.js"></script>
    <script src="./shared/js/dashboard.js"></script>
    <script src="./shared/js/crs-registry.js"></script>
    <script src="./shared/js/navbar-loader.js"></script>
    <script src="./shared/js/keyboard-navigation.js"></script>
    <script src="./shared/js/notification-system.js"></script>

    <script src="./vendor/proj4.js"></script>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <script src="./vendor/leaflet/leaflet.js"></script>

    <link rel="stylesheet" href="./shared/css/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body data-active-page="home">
    <div id="app-container">
      <main id="view-content" class="dashboard-view" tabindex="-1" aria-busy="false">

        <div class="dash-hero">
          <p class="hero-greeting">Welcome Back</p>
          <h1 class="hero-title">Survey <span>Tools</span></h1>
          <p class="hero-desc">Professional coordinate conversion, file workflows, and field calculations.</p>
          <div class="hero-stats">
            <div class="hero-stat">
              <div class="hero-stat-value" data-tool-count-label="geotools">6</div>
              <div class="hero-stat-label">Tools</div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-value">DLTM</div>
              <div class="hero-stat-label">System</div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-value">100%</div>
              <div class="hero-stat-label">Offline</div>
            </div>
          </div>
        </div>

        <div class="quick-strip">
          <button class="quick-chip active" type="button" onclick="if(typeof loadPage==='function')loadPage('')">
            <span class="quick-chip-dot"></span>All Tools
          </button>
          <button class="quick-chip" type="button" onclick="if(typeof loadPage==='function')loadPage('coordinate-tools')">
            Coordinates
          </button>
          <button class="quick-chip" type="button" onclick="if(typeof loadPage==='function')loadPage('file-converter')">
            Files
          </button>
          <button class="quick-chip" type="button" onclick="if(typeof loadPage==='function')loadPage('area-calculator')">
            Area
          </button>
        </div>

        <section class="app-section" aria-label="Survey tools">
          <p class="section-label">Survey Tools</p>
          <div class="grid" data-tools-grid="geotools"></div>
        </section>

      </main>
    </div>

    <script src="./shared/js/app-shell.js"></script>
  </body>
</html>
